name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentloom
          POSTGRES_USER: agentloom
          POSTGRES_PASSWORD: agentloom
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U agentloom -d agentloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTLOOM_ENV: test
      AGENTLOOM_DATABASE_URL: postgresql+asyncpg://agentloom:agentloom@localhost:15432/agentloom
      AGENTLOOM_LLM_PROVIDER: mock
      AGENTLOOM_LLM_MODEL: mock/schema
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --all-groups
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest -m "not live" --cov=agentloom --cov-report=term-missing
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
